name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ledger_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, pdo_sqlite, zip, redis
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 7)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Run the suite on MySQL too: row locks (lockForUpdate) are a no-op on SQLite.
      # The MySQL-only tests (CHECK constraints, multi-process concurrency) are skipped on SQLite.
      - name: Tests (SQLite, array cache)
        run: php artisan test

      # A fresh clone's setup path: every migration, the demo seeder, the
      # ledger check (exits 1 if debits != credits), and every down() method.
      - name: Migrate, seed and roll back on a clean MySQL database
        run: |
          php artisan migrate:fresh --seed --force
          php artisan ledger:trial-balance
          php artisan migrate:rollback --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ledger_test
          DB_USERNAME: root
          DB_PASSWORD: ''

      # Redis serializes cached values and shares state between tests; the
      # array store does neither, so this run catches what the first one can't.
      - name: Tests (MySQL, Redis cache)
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ledger_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          CACHE_STORE: redis
          REDIS_CLIENT: phpredis
          REDIS_HOST: 127.0.0.1

  docker:
    runs-on: ubuntu-latest
    name: Docker image

    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: docker compose build

      # The same suite inside the app container, against the compose MySQL and Redis.
      - name: Tests in the container
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          docker compose up -d --wait mysql redis
          docker compose run --rm -e DB_DATABASE=ledger_test app php artisan test

      - name: Smoke test the running stack
        run: |
          docker compose up -d --wait app web
          docker compose exec -T app php artisan migrate --force
          curl --fail --silent --show-error http://127.0.0.1:8080/up
