; Production-style settings. The code is baked into the image, so OPcache
; never needs to check files for changes.
memory_limit = 256M
expose_php = Off
upload_max_filesize = 10M
post_max_size = 12M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Run the code in the image as-is: rebuild it to deploy a change.
